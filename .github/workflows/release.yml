name: Release image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build and push to GHCR
        env:
          REF: ${{ github.ref }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          image="ghcr.io/$(printf '%s' "$REPO" | tr '[:upper:]' '[:lower:]')"

          case "$REF" in
            refs/tags/v*)
              v="${REF#refs/tags/}"                        # v1.2.3
              tags="-t $image:$v -t $image:${v%.*} -t $image:latest"
              platforms="linux/amd64,linux/arm64"
              version="$v"
              ;;
            *)
              tags="-t $image:edge"
              platforms="linux/amd64"
              version="edge-$(git rev-parse --short HEAD)"
              ;;
          esac

          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker run --privileged --rm tonistiigi/binfmt --install arm64
          docker buildx create --use --driver docker-container

          # shellcheck disable=SC2086
          docker buildx build \
            --platform "$platforms" \
            --build-arg "TESQIVO_VERSION=$version" \
            --provenance false \
            $tags \
            --push \
            .
