name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tesqivo
          POSTGRES_PASSWORD: tesqivo
          POSTGRES_DB: tesqivo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tesqivo" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      # Used by the alembic step (config requires these); the pytest steps set
      # their own values in tests/conftest.py.
      TESQIVO_DB_URL: postgresql+asyncpg://tesqivo:tesqivo@localhost:5432/tesqivo
      TESQIVO_REDIS_URL: redis://localhost:6379/0
      TESQIVO_SECRET_KEY: ci-secret-key-that-is-at-least-32-bytes-long
      TESQIVO_PUBLIC_URL: http://localhost:8000
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check app/ tests/
      - name: Alembic migration applies on PostgreSQL
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head
      - name: Test suite (SQLite)
        run: python -m pytest -q --cov=app --cov-report=term-missing
      - name: Test suite (PostgreSQL)
        env:
          TESQIVO_TEST_DB_URL: postgresql+asyncpg://tesqivo:tesqivo@localhost:5432/tesqivo
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Boot the stack from source (no .env)
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
      - name: Wait for health and exercise the app
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/v1/healthz; then ok=1; break; fi
            sleep 3
          done
          test -n "$ok"
          curl -fsS http://localhost:8080/api/v1/version | grep -q '"version"'
          curl -fsS http://localhost:8080/api/v1/setup/status | grep -q needs_setup
          curl -fsS http://localhost:8080/api/v1/openapi.json | grep -q '"openapi"'
          # the SPA is served at / and deep links fall back to index.html
          curl -fsS http://localhost:8080/ | grep -qi '<div id="root">'
          curl -fsS http://localhost:8080/p/DEMO/dashboard | grep -qi '<div id="root">'
      - name: create-admin CLI works without a bootstrap token
        run: |
          docker compose exec -T web python -m app.cli create-admin \
            --username ci --email ci@example.com --password 'Ci-Password-123' --display-name CI
          curl -fsS http://localhost:8080/api/v1/setup/status | grep -q '"needs_setup":false'
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

  image-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image (amd64, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
