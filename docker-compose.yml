name: tesqivo

# Self-hosting TESQIVO:
#
#   curl -O https://raw.githubusercontent.com/abhid001/TESQIVO/main/docker-compose.yml
#   docker compose up -d
#   docker compose exec web python -m app.cli create-admin
#
# No .env is required for a trial. For production set at least POSTGRES_PASSWORD
# and TESQIVO_PUBLIC_URL - see .env.example and docs/self-hosting.md.
# Contributors building from source use: docker-compose.dev.yml (override).

x-app-env: &app-env
  TESQIVO_DB_URL: postgresql+asyncpg://tesqivo:${POSTGRES_PASSWORD:-tesqivo}@db:5432/tesqivo
  TESQIVO_REDIS_URL: redis://redis:6379/0
  TESQIVO_PUBLIC_URL: ${TESQIVO_PUBLIC_URL:-http://localhost:8080}
  TESQIVO_SECRET_KEY: ${TESQIVO_SECRET_KEY:-}
  TESQIVO_ENVIRONMENT: production
  # Optional gate for the browser "create first admin" screen. Unset (the
  # default) means that screen always rejects every token - use
  # `docker compose exec web python -m app.cli create-admin` instead, which
  # needs no token at all.
  TESQIVO_BOOTSTRAP_TOKEN: ${TESQIVO_BOOTSTRAP_TOKEN:-}
  TESQIVO_SMTP_HOST: ${TESQIVO_SMTP_HOST:-}
  TESQIVO_SMTP_PORT: ${TESQIVO_SMTP_PORT:-587}
  TESQIVO_SMTP_USER: ${TESQIVO_SMTP_USER:-}
  TESQIVO_SMTP_PASSWORD: ${TESQIVO_SMTP_PASSWORD:-}
  TESQIVO_SMTP_FROM: ${TESQIVO_SMTP_FROM:-}
  TESQIVO_SMTP_STARTTLS: ${TESQIVO_SMTP_STARTTLS:-true}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tesqivo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tesqivo}
      POSTGRES_DB: tesqivo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tesqivo -d tesqivo"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    image: ghcr.io/abhid001/tesqivo:${TESQIVO_VERSION:-latest}
    environment: *app-env
    ports:
      - "${TESQIVO_HTTP_PORT:-8080}:8080"
    volumes:
      - appdata:/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    image: ghcr.io/abhid001/tesqivo:${TESQIVO_VERSION:-latest}
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *app-env
      TESQIVO_AUTO_MIGRATE: "0"
    volumes:
      - appdata:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,redis; redis.from_url(os.environ['TESQIVO_REDIS_URL']).ping()"
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      web:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  appdata:
