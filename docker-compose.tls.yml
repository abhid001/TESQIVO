name: tesqivo

# Optional: terminate HTTPS with Caddy (automatic Let's Encrypt certificates).
# Point DNS for $TESQIVO_DOMAIN at this host, then:
#
#   export TESQIVO_DOMAIN=tcms.example.com
#   export TESQIVO_PUBLIC_URL=https://tcms.example.com
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d
#
# If you already run your own reverse proxy, skip this file and point it at the
# web container's published port instead.
#
# The app's plain-HTTP port is still published (default 8080). To keep it off the
# public interface, set TESQIVO_HTTP_PORT=127.0.0.1:8080 before `up`.

services:
  caddy:
    image: caddy:2-alpine
    environment:
      TESQIVO_DOMAIN: ${TESQIVO_DOMAIN:?set TESQIVO_DOMAIN to your public hostname}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  caddydata:
  caddyconfig:
